<!DOCTYPE html>
<html lang="en" data-skin="flat">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traf</title>
  <meta name="description" content="Personal site of traf. Experiments, works, and notes.">
  <link rel="icon" href="assets/favicon.ico" sizes="48x48" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main>
    <div class="desktop">
      <div class="finder-shell">
        <section class="finder" id="finder" data-menu-open="false" aria-label="Personal filesystem">
          <aside class="finder-sidebar">
            <nav class="tree" aria-label="Folder tree">
              <div class="tree-bar">
                <svg class="logo desktop-only" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M12 2L3 7v10l9 5 9-5V7l-9-5zm0 2.2l6.5 3.6v7.4L12 19.8 5.5 15.2V7.8L12 4.2z"/></svg>
                <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Open file tree" aria-expanded="false" aria-controls="file-tree">
                  <span class="brand">traf</span>
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M4 13H20V16H4Z" class="menu-bar"/></svg>
                </button>
                <a class="mobile-handle" href="https://x.com/traf" target="_blank" rel="noopener noreferrer">[@traf]</a>
              </div>
              <div class="tree-branches" id="file-tree"></div>
            </nav>
            <button type="button" class="privacy-btn" id="privacy-btn" aria-label="Privacy mode" aria-pressed="true" title="Turn privacy off (/)">
              <span class="privacy-dot"></span>
            </button>
          </aside>

          <div class="finder-preview">
            <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
            <div class="finder-content" id="content"></div>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
